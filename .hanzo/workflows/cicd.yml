name: CI/CD

# One job: the gate proves the export, and on main the same bytes publish to the
# Sites plane through the shared action (hanzoai/ci bin/site), declared in hanzo.yml.
# The action reads the deploy key from KMS; the KMS client identity is a forge
# org secret. Domains are project records, not a build step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tel-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: linux-amd64
    timeout-minutes: 30
    # The image bakes another Playwright's chromium, read-only, under /opt/playwright;
    # this one's goes where the job may write.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tc
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Publish to the Sites plane
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: hanzoai/ci/.github/actions/site@v1
        with:
          slug: tel
          dir: out
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
