name: CI/CD

# Two cars, and the order is the whole point: the gate proves the tree, then the
# image is BUILT AND PUSHED — nothing here deploys.
#
# It lives at .hanzo/workflows, on the FORGE, because that is where the runners
# are. github.com has ZERO self-hosted runners for luxfi — measured:
# /orgs/luxfi/actions/runners is total_count 0 — and an unclaimable job does not
# fail, it QUEUES until the 24h timeout while the next push stacks behind it.
# Silence, not an error. Two runs sat queued for six minutes proving it.
#
# `runs-on: [lux-build-linux-amd64]` is the label the forge pools advertise, used
# by 111 workflows across lux. `lux-build-amd64` — one segment short — matches
# nothing, and four repos carry a comment saying so, which is how this was found
# rather than guessed.
#
# Deploying is a tag pinned in lux/universe, which Hanzo CD reconciles. A workflow
# that pushed bytes at a running site would be a second way to deploy, and the one
# that is not declared state is the one that silently disagrees with it.
#
#   push        -> gate -> image  (ghcr.io/luxfi/tel:sha-<sha7>)
#   tag v*      -> gate -> image  (ghcr.io/luxfi/tel:vX.Y.Z)   <- the release
#   universe    -> pin that tag                                 <- the deploy
#   Hanzo CD    -> reconcile
#
# Semver only: a branch push produces an immutable sha- tag and never a floating
# one, so nothing that reaches a cluster can move under it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: tel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [lux-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tc
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Drives the BUILT export, so what the gate proves is what the image carries:
      # the 44px tap targets, no horizontal overflow, no supplier named on any page,
      # and a console that offers Lux ID and holds no credential.
      - run: pnpm test:e2e

  # The build is INLINE, and that is a workaround with a reason and an owner.
  #
  # The fleet's shared lane is `hanzoai/.github/.github/workflows/docker-build.yml@main`,
  # and GitHub refuses it: a dispatch answers HTTP 422 `failed to parse workflow:
  # error parsing called workflow`, so every run dies in 0s with no log. It is not
  # this repo — luxfi/blog's last runs failed the same way in June and hanzoai/iam's
  # in August, which is why six iam releases were tagged and none built. Restore the
  # `uses:` the moment that file parses again; this is nine lines of duplication
  # held against a broken dependency, not a second build lane by choice.
  image:
    needs: gate
    if: github.event_name != 'pull_request'
    runs-on: [lux-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Semver from a v* tag, an immutable sha- tag from a branch push, and NEVER a
      # floating one — nothing that reaches a cluster may move under its own name.
      - id: tags
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tags=ghcr.io/luxfi/tel:${GITHUB_REF_NAME#v},ghcr.io/luxfi/tel:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/luxfi/tel:sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
