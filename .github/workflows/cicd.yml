name: CI/CD

# Two cars, and the order is the whole point: the gate proves the tree, then the
# image is BUILT AND PUSHED — nothing here deploys.
#
# It lives at .github/workflows and not .hanzo/workflows, and that is measured
# rather than preferred. The forge resolves a `uses:` through the same
# WORKFLOW_DIRS allowlist it collects workflows from, and hanzoai/.github publishes
# docker-build.yml ONLY at .github/workflows — so a forge-side copy cannot resolve
# the one build lane the fleet has. Every luxfi image that exists today
# (ghcr.io/luxfi/blog, 14 tags) is built exactly this way; the repos that tried the
# other shape have zero.
#
# Deploying is a tag pinned in lux/universe, which Hanzo CD reconciles. A workflow
# that pushed bytes at a running site would be a second way to deploy, and the one
# that is not declared state is the one that silently disagrees with it.
#
#   push        -> gate -> image  (ghcr.io/luxfi/tel:sha-<sha7>)
#   tag v*      -> gate -> image  (ghcr.io/luxfi/tel:vX.Y.Z)   <- the release
#   universe    -> pin that tag                                 <- the deploy
#   Hanzo CD    -> reconcile
#
# Semver only: a branch push produces an immutable sha- tag and never a floating
# one, so nothing that reaches a cluster can move under it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: tel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: lux-build-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tc
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Drives the BUILT export, so what the gate proves is what the image carries:
      # the 44px tap targets, no horizontal overflow, no supplier named on any page,
      # and a console that offers Lux ID and holds no credential.
      - run: pnpm test:e2e

  # The one build lane the fleet has. It builds for the luxfi registry on the luxfi
  # pools — labels never cross orgs, and a cross-org runs-on queues silently until
  # it cancels at the 24h timeout.
  image:
    needs: gate
    if: github.event_name != 'pull_request'
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/luxfi/tel
      runner-amd64: '["self-hosted","linux","amd64"]'
      runner-deploy: '["self-hosted","linux","amd64"]'
    secrets: inherit
