# Cloudflare Worker serving the Next.js static export (`pnpm build` -> ./out).
# Deploy: `wrangler deploy`
name = "lux-tel"
compatibility_date = "2024-11-01"

routes = [
  { pattern = "lux.tel", custom_domain = true },
  { pattern = "www.lux.tel", custom_domain = true }
]

[assets]
directory = "./out"
not_found_handling = "404-page"
